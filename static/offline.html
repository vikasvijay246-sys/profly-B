<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline - PropFlow</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/pwa.css" />
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .offline-shell {
      max-width: 420px;
      width: 100%;
      margin: 24px;
      padding: 28px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.14);
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.35);
    }
    .offline-shell h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    .offline-shell p {
      margin: 0 0 22px;
      line-height: 1.65;
      color: #cbd5e1;
    }
    .offline-shell a {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease;
    }
    .offline-shell a:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="offline-shell">
    <h1>You're offline</h1>
    <p>PropFlow can still display cached screens. Reconnect to continue normal app activity.</p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
